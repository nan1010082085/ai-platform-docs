# 文档站点 nginx 配置
# 复制到服务器的 /etc/nginx/conf.d/docs.conf 或 include 到主配置

server {
    listen 80;
    server_name docs.your-domain.com;  # 改为你的域名

    root /var/www/docs;  # deploy.sh 的 DEPLOY_PATH
    index index.html;

    # SPA 路由（VitePress 需要）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1000;
}
